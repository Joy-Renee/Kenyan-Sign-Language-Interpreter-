<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KSL assistant (Phase 0 skeleton)</title>
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
  pre { padding: .75rem; overflow-x: auto; border: 1px solid #8884; border-radius: 6px; }
</style>
</head>
<body>
<h1>KSL assistant</h1>
<p><strong>Phase 0 skeleton.</strong> The camera and sign recognition are not built yet. This page only checks that the proxy is reachable.</p>
<button id="t">Test proxy with "me send money mother"</button>
<pre id="out">(no request sent yet)</pre>
<script type="module">
  document.getElementById('t').onclick = async () => {
    const out = document.getElementById('out');
    out.textContent = 'sending...';
    try {
      const r = await fetch('/api/interpret', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ signs: ['me', 'send', 'money', 'mother'], lang: 'both' }) });
      out.textContent = JSON.stringify(await r.json(), null, 2);
    } catch (e) { out.textContent = 'request failed: ' + e.message; }
  };
</script>
</body>
</html>
